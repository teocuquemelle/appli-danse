<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Appli Danse — Carnet de composition</title>
<meta name="theme-color" content="#120f1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120f1a;
  --bg-panel:#1c1728;
  --bg-panel-2:#231c33;
  --line: rgba(244,240,234,0.10);
  --text:#f4f0ea;
  --text-dim:#a89fb5;
  --amber:#f2b134;
  --magenta:#e8508f;
  --teal:#35d0b2;
  --danger:#e35d5d;
  --radius:16px;
  --shadow: 0 12px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 60% 40% at 20% -10%, rgba(232,80,143,0.16), transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 0%, rgba(53,208,178,0.12), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.display{font-style:italic; font-weight:500;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--magenta); color:#120f1a;}

/* ---------- layout shells ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
header.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:rgba(18,15,26,0.86); backdrop-filter:blur(10px); z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:20px;}
.brand .dot{width:10px;height:10px;border-radius:50%; background:var(--amber); box-shadow:0 0 14px var(--amber);}
.topbar-actions{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text-dim);}
main{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:28px 20px 80px;}

/* ---------- buttons / inputs ---------- */
.btn{
  border:1px solid var(--line); background:var(--bg-panel-2); color:var(--text);
  padding:10px 16px; border-radius:999px; cursor:pointer; font-weight:600; font-size:14px;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.btn:hover{transform:translateY(-1px); border-color:rgba(244,240,234,0.28);}
.btn.primary{background:var(--amber); color:#221a08; border-color:transparent;}
.btn.primary:hover{background:#ffc85c;}
.btn.magenta{background:var(--magenta); color:#22081a; border-color:transparent;}
.btn.teal{background:var(--teal); color:#08221c; border-color:transparent;}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent; color:var(--danger); border-color:rgba(227,93,93,0.4);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn.sm{padding:6px 12px; font-size:12.5px;}

input[type=text], input[type=password], input[type=email], input[type=url], textarea, select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg-panel); color:var(--text); font-family:inherit; font-size:15px;
}
textarea{resize:vertical; min-height:90px;}
input:focus, textarea:focus, select:focus, button:focus-visible{
  outline:2px solid var(--amber); outline-offset:2px;
}
label{font-size:13px; color:var(--text-dim); display:block; margin-bottom:6px; font-weight:600; letter-spacing:.02em;}
.field{margin-bottom:16px;}

.card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; box-shadow:var(--shadow);
}
.grid{display:grid; gap:16px;}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.muted{color:var(--text-dim);}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; background:var(--bg-panel-2); font-size:12.5px; color:var(--text-dim); border:1px solid var(--line);}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:0;}
.tab{padding:10px 16px; border-radius:10px 10px 0 0; cursor:pointer; font-weight:700; font-size:14px; color:var(--text-dim); border:1px solid transparent;}
.tab.active{color:var(--text); border:1px solid var(--line); border-bottom:1px solid var(--bg); background:var(--bg-panel); margin-bottom:-1px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
.hidden{display:none !important;}
.center{text-align:center;}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--bg-panel-2); border:1px solid var(--line); padding:10px 18px; border-radius:999px;
  font-size:14px; z-index:100; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
}
.toast.show{opacity:1; bottom:32px;}
.offline-flag{display:none; background:var(--danger); color:#2a0d0d; font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px;}
body.offline .offline-flag{display:inline-block;}

/* ---------- bubble field (inducteur + mots) ---------- */
.bubblefield-wrap{margin-bottom:18px;}
.bubblefield{
  position:relative; height:min(58vh, 480px); border:1px dashed var(--line); border-radius:var(--radius);
  overflow:hidden; background:
    radial-gradient(circle at 50% 50%, rgba(244,240,234,0.05), transparent 60%);
}
.bubble{
  position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
  text-align:center; font-family:'Fraunces',serif; font-style:italic; font-weight:600; padding:6px;
  animation:drift 7s ease-in-out infinite; user-select:none;
}
@keyframes drift{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(var(--dx,4px), var(--dy,-6px));}
}
.bubble.inducteur{
  width:170px;height:170px; background:var(--magenta); color:#22081a; font-size:22px; z-index:5;
  box-shadow:0 0 40px rgba(232,80,143,0.45);
}
.bubble.mot{
  background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text); font-size:14px;
  width:96px; height:96px; position:relative;
}
.bubble-rm{
  position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%;
  background:var(--danger); color:#2a0d0d; font-family:'Manrope',sans-serif; font-weight:800; font-size:12px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:6;
  box-shadow:0 2px 6px rgba(0,0,0,0.4); animation:none;
}
.bubble-rm:hover{background:#ff7373;}
.bubble.mot:nth-child(3n){border-color:rgba(53,208,178,0.5);}
.bubble.mot:nth-child(4n){border-color:rgba(242,177,52,0.5);}

.wordbar{display:flex; gap:10px; margin-top:14px;}
.wordbar input{flex:1;}

/* ---------- procede card ---------- */
.procede-card{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;}
.procede-video{flex:1 1 320px; min-width:260px;}
.procede-video iframe, .procede-video video{width:100%; aspect-ratio:16/9; border-radius:12px; border:1px solid var(--line);}
.procede-text{flex:1 1 260px;}

/* ---------- timeline / frise ---------- */
.palette{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.chip{
  padding:8px 14px; border-radius:999px; font-size:13.5px; cursor:grab; user-select:none;
  border:1px solid var(--line); background:var(--bg-panel-2);
}
.chip.type-mot{border-color:rgba(244,240,234,0.25);}
.chip.type-procede{background:rgba(53,208,178,0.15); border-color:rgba(53,208,178,0.5);}
.timeline{
  position:relative; height:330px; border:1px solid var(--line); border-radius:var(--radius);
  padding:0 80px;
  background:
    repeating-linear-gradient(90deg, rgba(244,240,234,0.05) 0 1px, transparent 1px 10%),
    var(--bg-panel);
  overflow:visible;
}
.timeline-lane-label{
  position:absolute; left:10px; top:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-dim); font-weight:700; padding-top:4px;
}
.timeline-lane-sep{position:absolute; left:0; right:0; border-top:1px dashed var(--line);}
.timeline::before{
  content:"début"; position:absolute; left:10px; top:8px; font-size:11px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase;
}
.timeline::after{
  content:"fin"; position:absolute; right:10px; top:8px; font-size:11px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase;
}
.timeline-chip{
  position:absolute; transform:translate(-50%,0); padding:7px 12px; border-radius:10px; font-size:13px;
  cursor:grab; box-shadow:var(--shadow); display:flex; align-items:center; gap:6px; max-width:160px;
}
.timeline-chip.type-mot{background:var(--bg-panel-2); border:1px solid rgba(244,240,234,0.3);}
.timeline-chip.type-procede{background:rgba(53,208,178,0.9); color:#08221c; font-weight:700;}
.timeline-chip .rm{cursor:pointer; opacity:.6; font-weight:800;}
.timeline-chip .rm:hover{opacity:1;}
.timeline-chip.type-note{
  width:24px; height:24px; padding:0; border-radius:50%; justify-content:center;
  background:var(--amber); color:#221a08; font-weight:800; z-index:3; overflow:visible;
  transition:width .18s ease, height .18s ease, border-radius .18s ease, padding .18s ease;
}
.timeline-chip.type-note .note-icon{font-size:14px; line-height:1;}
.timeline-chip.type-note textarea{
  display:none; position:absolute; top:32px; left:50%; transform:translateX(-50%);
  width:190px; min-height:76px; background:var(--bg-panel-2); color:var(--text);
  border:1px solid var(--line); border-radius:10px; padding:8px; font-size:13px; z-index:25;
}
.timeline-chip.type-note.expanded{
  width:auto; min-width:60px; height:auto; border-radius:14px; padding:6px 10px; z-index:30;
  align-items:flex-start;
}
.timeline-chip.type-note.expanded textarea{display:block;}
.timeline-add-hint{font-size:12px; color:var(--text-dim); margin-top:8px;}

/* ---------- tables (admin) ---------- */
table{width:100%; border-collapse:collapse; font-size:14px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
th{color:var(--text-dim); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;}
.progress-track{background:var(--bg-panel-2); border-radius:999px; height:8px; width:120px; overflow:hidden;}
.progress-fill{height:100%; background:var(--teal);}

@media(max-width:640px){
  main{padding:20px 14px 70px;}
  .bubble.inducteur{width:130px;height:130px; font-size:18px;}
  .bubble.mot{width:80px;height:80px; font-size:12.5px;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Appli Danse</div>
    <div class="topbar-actions">
      <span class="offline-flag">HORS LIGNE</span>
      <span id="whoami" class="pill hidden"></span>
      <button class="btn sm ghost hidden" id="btnLogout">Se déconnecter</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase (SDK compat, sans build) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
/* =========================================================
   CONFIG — à remplacer par votre projet Firebase (nouveau
   projet dédié, distinct de badminton-lycee).
   Console Firebase > Paramètres du projet > Vos applications.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCcy9YEtLAfAzSqqKDfBKheUq9BshItDeY",
  authDomain: "appli-danse.firebaseapp.com",
  projectId: "appli-danse",
  storageBucket: "appli-danse.firebasestorage.app",
  messagingSenderId: "853872515382",
  appId: "1:853872515382:web:9619be7d136449c539bb97",
  measurementId: "G-DXB665Q2E8"
};
const firebaseReady = !Object.values(firebaseConfig).some(v => v === "REMPLACER");
let auth, db, storage;
if(firebaseReady){
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    storage = firebase.storage();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){
    console.error('Erreur Firebase :', e);
  }
} else {
  console.warn('Config Firebase non renseignée : remplacez les "REMPLACER" dans firebaseConfig.');
}

/* ---------------- état global ---------------- */
const ROLES = ['Spectateur','Coach','Analyseur vidéo'];
const state = {
  view: 'home',
  adminUser: null,
  group: JSON.parse(localStorage.getItem('danse_group')||'null'),
  moi: null, // identité de l'élève courant dans le groupe (choisie à la connexion)
  lecons: [],
  procedes: [],
  composantes: [],
  groupes: [],
  fichesSpectateur: [],
  notesCoach: [],
  analysesVideo: [],
  currentLeconId: null,
  leconDraft: null,     // {Numero, Inducteur, Mots, Procede, Composante}
  adminTab: 'lecons',
  eleveTab: 'historique'
};
if(state.group){ state.moi = localStorage.getItem('danse_moi_'+state.group.id) || null; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function genPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
window.addEventListener('online', ()=>document.body.classList.remove('offline'));
window.addEventListener('offline', ()=>document.body.classList.add('offline'));
if(!navigator.onLine) document.body.classList.add('offline');

/* ---------------- routage minimal ---------------- */
function go(view, extra){
  state.view = view;
  Object.assign(state, extra||{});
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ================= HEADER (whoami / logout) ================= */
function refreshHeader(){
  const who = document.getElementById('whoami');
  const btn = document.getElementById('btnLogout');
  if(state.adminUser){
    who.textContent = 'Prof · ' + state.adminUser;
    who.classList.remove('hidden'); btn.classList.remove('hidden');
    btn.onclick = ()=>{ auth.signOut(); state.adminUser=null; go('home'); };
  } else if(state.group){
    who.textContent = 'Groupe · ' + state.group.Nom + (state.moi ? ' — ' + state.moi : '');
    who.classList.remove('hidden'); btn.classList.remove('hidden');
    btn.onclick = ()=>{ localStorage.removeItem('danse_group'); localStorage.removeItem('danse_moi_'+state.group.id); state.group=null; state.moi=null; go('home'); };
  } else {
    who.classList.add('hidden'); btn.classList.add('hidden');
  }
}

/* ================= VUE : ACCUEIL ================= */
function viewHome(){
  return `
  ${!firebaseReady ? `<div class="card" style="max-width:640px;margin:0 auto 24px;border-color:var(--danger);">
    <strong style="color:var(--danger);">⚠️ Firebase n'est pas encore configuré.</strong>
    <p class="muted" style="font-size:13.5px;margin:6px 0 0;">Remplacez les valeurs "REMPLACER" dans le bloc <code>firebaseConfig</code> en haut du fichier <code>index.html</code> (voir le guide de mise en place). En attendant, la connexion et l'enregistrement des données ne fonctionneront pas.</p>
  </div>` : ''}
  <div class="center" style="max-width:640px;margin:6vh auto 0;">
    <h1 class="display" style="font-size:38px;margin-bottom:6px;">Le carnet de composition</h1>
    <p class="muted" style="margin-bottom:36px;">Inducteurs, mots, procédés de composition et frise chronologique — de la recherche collective à la chorégraphie de groupe.</p>
    <div class="grid cols-2">
      <div class="card">
        <h3 style="margin-top:0;">Espace professeur</h3>
        <p class="muted" style="font-size:14px;">Mener les 4-5 leçons de recherche, gérer la banque de procédés, suivre les groupes.</p>
        <button class="btn primary" onclick="go('admin-login')">Se connecter</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Espace élève</h3>
        <p class="muted" style="font-size:14px;">Revoir l'historique des leçons, créer ou rejoindre votre groupe, construire votre frise.</p>
        <button class="btn magenta" onclick="go('eleve-login')">Entrer</button>
      </div>
    </div>
  </div>`;
}

/* ================= AUTH PROF ================= */
function viewAdminLogin(){
  setTimeout(()=>{
    document.getElementById('formAdmin').onsubmit = async (e)=>{
      e.preventDefault();
      const email = document.getElementById('aEmail').value.trim();
      const pwd = document.getElementById('aPwd').value;
      const err = document.getElementById('aErr');
      err.textContent = '';
      try{
        await auth.signInWithEmailAndPassword(email, pwd);
        state.adminUser = email;
        await loadLecons(); await loadProcedes(); await loadComposantes(); await loadGroupes(); state.allFiches = await loadAllFichesSpectateur(); state.allNotes = await loadAllNotesCoach(); state.allAnalyses = await loadAllAnalysesVideo();
        go('admin-panel');
      }catch(ex){ err.textContent = "Connexion impossible : " + (ex.message||ex); }
    };
  },0);
  return `
  <div class="card" style="max-width:420px;margin:8vh auto;">
    <h2 class="display" style="margin-top:0;">Connexion professeur</h2>
    <form id="formAdmin">
      <div class="field"><label>E-mail</label><input type="email" id="aEmail" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="aPwd" required></div>
      <p id="aErr" style="color:var(--danger); font-size:13px; min-height:18px;"></p>
      <button class="btn primary" type="submit" style="width:100%;">Se connecter</button>
    </form>
    <p class="muted" style="font-size:12.5px;margin-top:14px;">Compte créé manuellement dans Firebase Console (Authentication → Users), jamais via l'appli.</p>
    <p><a href="#" onclick="go('home');return false;" class="muted" style="font-size:13px;">&larr; Retour</a></p>
  </div>`;
}

/* ================= CHARGEMENT DONNÉES ================= */
async function loadLecons(){
  const snap = await db.collection('lecons').orderBy('Numero').get();
  state.lecons = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadProcedes(){
  const snap = await db.collection('procedes').orderBy('Nom').get();
  state.procedes = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadComposantes(){
  const snap = await db.collection('composantes').orderBy('Nom').get();
  state.composantes = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadGroupes(){
  const snap = await db.collection('groupes').orderBy('DateCreation').get();
  state.groupes = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadFichesSpectateur(groupeId){
  const snap = await db.collection('fichesSpectateur').where('GroupeId','==',groupeId).get();
  state.fichesSpectateur = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadNotesCoach(groupeId){
  const snap = await db.collection('notesCoach').where('GroupeId','==',groupeId).get();
  state.notesCoach = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadAnalysesVideo(groupeId){
  const snap = await db.collection('analysesVideo').where('GroupeId','==',groupeId).get();
  state.analysesVideo = snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadAllFichesSpectateur(){
  const snap = await db.collection('fichesSpectateur').get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadAllNotesCoach(){
  const snap = await db.collection('notesCoach').get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function loadAllAnalysesVideo(){
  const snap = await db.collection('analysesVideo').get();
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}

/* ================= VUE : PANEL ADMIN ================= */
function viewAdminPanel(){
  const tabs = [['lecons','Leçons'],['groupes','Groupes'],['banque','Procédés'],['composantes','Composantes'],['roles','Rôles AFL3']];
  let body = '';
  if(state.adminTab==='lecons') body = adminTabLecons();
  if(state.adminTab==='groupes') body = adminTabGroupes();
  if(state.adminTab==='banque') body = adminTabBanque();
  if(state.adminTab==='composantes') body = adminTabComposantes();
  if(state.adminTab==='roles') body = adminTabRoles();
  return `
  <div class="tabs">
    ${tabs.map(([k,l])=>`<div class="tab ${state.adminTab===k?'active':''}" onclick="go('admin-panel',{adminTab:'${k}'})">${l}</div>`).join('')}
  </div>
  ${body}`;
}

function adminTabLecons(){
  const rows = state.lecons.map(l=>`
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div>
        <strong>Leçon ${l.Numero}</strong> — inducteur : <em class="display">${l.Inducteur||'(vide)'}</em>

function embedVideo(url){
  if(!url) return '';
  const yt = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" title="vidéo procédé" frameborder="0" allowfullscreen></iframe>`;
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return `<iframe src="https://player.vimeo.com/video/${vimeo[1]}" title="vidéo procédé" frameborder="0" allowfullscreen></iframe>`;
  return `<video controls src="${url}"></video>`;
}

// Placement en spirale avec évitement de collision : chaque mot cherche
// la première position libre en s'éloignant progressivement du centre.
// onRemove(index) optionnel : si fourni, affiche un bouton ✕ sur chaque bulle-mot.
function renderBubbles(elId, inducteur, mots, onRemove){
  const el = document.getElementById(elId);
  if(!el) return;
  const w = el.clientWidth, h = el.clientHeight;
  const cx = w/2, cy = h/2;
  const rInd = 85;
  const placed = [{x:cx, y:cy, r:rInd}];
  let html = `<div class="bubble inducteur" style="left:${cx-rInd}px; top:${cy-rInd}px;">${escapeHtml(inducteur||'…')}</div>`;
  (mots||[]).forEach((mot,i)=>{
    const r = 48;
    let angle = i * 137.5 * Math.PI/180;
    let radius = rInd + 55;
    let x=cx, y=cy, ok=false, tries=0;
    while(!ok && tries<80){
      x = cx + Math.cos(angle)*radius;
      y = cy + Math.sin(angle)*radius;
      ok = placed.every(p=>{
        const dx=x-p.x, dy=y-p.y;
        return Math.sqrt(dx*dx+dy*dy) >= (p.r + r + 8);
      });
      if(!ok){ radius += 12; angle += 0.34; }
      tries++;
    }
    x = Math.max(r, Math.min(w-r, x));
    y = Math.max(r, Math.min(h-r, y));
    placed.push({x, y, r});
    const dx = (Math.random()*8-4).toFixed(1), dy=(Math.random()*8-4).toFixed(1);
    const dur = (5+Math.random()*4).toFixed(1);
    html += `<div class="bubble mot" data-idx="${i}" style="left:${x-r}px; top:${y-r}px; --dx:${dx}px; --dy:${dy}px; animation-duration:${dur}s;">${escapeHtml(mot)}${onRemove?'<span class="bubble-rm">✕</span>':''}</div>`;
  });
  el.innerHTML = html;
  if(onRemove){
    el.querySelectorAll('.bubble.mot').forEach(b=>{
      b.querySelector('.bubble-rm').addEventListener('click', (e)=>{
        e.stopPropagation();
        onRemove(parseInt(b.dataset.idx,10));
      });
    });
  }
}

async function addMembre(id){

  const membres = [...(g.Membres||[]), v];
  await db.collection('groupes').doc(id).set({Membres:membres},{merge:true});
  await loadGroupes(); manageGroupe(id);
}
async function removeMembre(id,i){

async function deleteGroupe(id){

      ${n.Conseil?`<p class="muted">💬 ${escapeHtml(n.Conseil)}</p>`:''}
    </div>`).join('') : '<p class="muted">Aucune note pour l\'instant.</p>'}`;
}

/* ---- Outil Analyseur vidéo : filmer / uploader + notes horodatées ---- */
function eleveTabVideo(){
  const g = state.group;
  const mesAnalyses = (state.analysesVideo||[]).filter(v=>v.Analyste===state.moi);
  setTimeout(()=>{
    const input = document.getElementById('videoFile');
    if(input) input.onchange = async ()=>{
      const file = input.files[0];
      if(!file) return;
      if(!storage){ toast('Firebase Storage indisponible'); return; }
      const status = document.getElementById('uploadStatus');
      status.textContent = 'Envoi en cours…';
      try{
        const path = `analyses/${g.id}/${state.moi}_${Date.now()}_${file.name}`;
        const ref = storage.ref().child(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        await db.collection('analysesVideo').add({GroupeId:g.id, Analyste:state.moi, VideoUrl:url, VideoNom:file.name, Notes:[], DateCreation:new Date().toISOString()});
        await loadAnalysesVideo(g.id);
        status.textContent = ''; toast('Vidéo envoyée'); render();
      }catch(err){
        status.textContent = 'Échec de l\'envoi : ' + (err.message||err);
      }
    };
  },0);
  return `
  <div class="card" style="max-width:520px;">
    <h3 style="margin-top:0;">Filmer / envoyer une séquence</h3>
    <p class="muted" style="font-size:13.5px;">Sur tablette, ceci ouvre directement l'appareil photo pour filmer. Sur ordinateur, choisis un fichier vidéo déjà enregistré.</p>
    <input id="videoFile" type="file" accept="video/*" capture="environment">
    <p id="uploadStatus" class="muted" style="font-size:13px;min-height:18px;"></p>
  </div>
  <h3 style="margin:22px 0 10px;">Mes analyses (${mesAnalyses.length})</h3>
  ${mesAnalyses.length ? mesAnalyses.map(v=>videoAnalysisCard(v)).join('') : '<p class="muted">Aucune vidéo envoyée pour l\'instant.</p>'}`;
}
function videoAnalysisCard(v){
  return `
  <div class="card" style="margin-bottom:16px;">
    <video controls src="${v.VideoUrl}" style="width:100%; border-radius:10px; max-height:340px;"></video>
    <p class="muted" style="font-size:12.5px; margin:8px 0 4px;">${escapeHtml(v.VideoNom||'')}</p>
    <div style="display:flex; gap:8px; margin:10px 0;">
      <input type="text" id="time-${v.id}" placeholder="0:45" style="max-width:90px;">
      <input type="text" id="note-${v.id}" placeholder="Observation à ce moment…">
      <button class="btn sm primary" onclick="addVideoNote('${v.id}')">Ajouter</button>
    </div>
    ${(v.Notes||[]).map(n=>`<div class="pill" style="margin:3px 4px 3px 0;">⏱ ${escapeHtml(n.time)} — ${escapeHtml(n.texte)}</div>`).join('')}
  </div>`;
}
async function addVideoNote(id){
  const time = document.getElementById('time-'+id).value.trim();
  const texte = document.getElementById('note-'+id).value.trim();
  if(!time || !texte) return;
  const v = state.analysesVideo.find(x=>x.id===id);
  v.Notes = v.Notes||[];
  v.Notes.push({time, texte});
  await db.collection('analysesVideo').doc(id).set({Notes:v.Notes},{merge:true});
  render();
}

function eleveTabFrise(){
  const g = state.group;
  const tokens = [
    ...(g.Mots||[]).map(m=>({type:'mot', texte:m})),
    ...(g.ProcedesChoisis||[]).map(p=>({type:'procede', texte:p.Nom}))
  ];
  function posFromEvent(e, rect){
    const innerW = rect.width - 160;
    return Math.max(0, Math.min(100, ((e.clientX - rect.left - 80) / innerW) * 100));
  }
  setTimeout(()=>{
    document.querySelectorAll('.chip[draggable]').forEach(c=>{
      c.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', JSON.stringify({type:c.dataset.type, texte:c.dataset.texte, existingId:null}));
      });
    });
    document.querySelectorAll('.timeline-chip[draggable]').forEach(c=>{
      c.addEventListener('dragstart', e=>{
        if(e.target.tagName==='TEXTAREA'){ e.preventDefault(); return; }
        e.dataTransfer.setData('text/plain', JSON.stringify({type:c.dataset.type, texte:c.dataset.texte, existingId:c.dataset.id}));
      });
    });
    document.querySelectorAll('.timeline-chip.type-note').forEach(el=>{
      const ta = el.querySelector('textarea');
      el.addEventListener('mouseenter', ()=>el.classList.add('expanded'));
      el.addEventListener('mouseleave', ()=>{ if(document.activeElement!==ta) el.classList.remove('expanded'); });
      ta.addEventListener('focus', ()=>el.classList.add('expanded'));
      ta.addEventListener('blur', ()=>el.classList.remove('expanded'));
    });
    const tl = document.getElementById('timeline');
    tl.addEventListener('dragover', e=>e.preventDefault());
    tl.addEventListener('drop', e=>{
      e.preventDefault();
      const data = JSON.parse(e.dataTransfer.getData('text/plain'));
      const rect = tl.getBoundingClientRect();
      const pos = posFromEvent(e, rect);
      g.Frise = g.Frise||[];
      if(data.existingId){
        const item = g.Frise.find(x=>x.id===data.existingId);
        if(item) item.pos = pos;
      } else {
        g.Frise.push({id:uid(), type:data.type, texte:data.texte, pos});
      }
      saveGroupe({Frise:g.Frise}); render();
    });
    tl.addEventListener('dblclick', e=>{
      if(e.target.closest('.timeline-chip')) return;
      const rect = tl.getBoundingClientRect();
      const laneIdx = Math.floor((e.clientY - rect.top) / 108);
      if(laneIdx !== 2){ toast('Double-cliquez sur la ligne « Notes » pour ajouter une note libre'); return; }
      const pos = posFromEvent(e, rect);
      g.Frise = g.Frise||[];
      g.Frise.push({id:uid(), type:'note', texte:'', pos});
      saveGroupe({Frise:g.Frise}); render();
    });
  },0);
  const chipLeft = pos => `calc(80px + (100% - 160px) * ${(pos/100).toFixed(4)})`;
  // Trois couloirs fixes (Mots / Procédés / Notes) ; à l'intérieur d'un couloir,
  // les éléments trop proches dans le temps se décalent automatiquement pour ne
  // jamais se chevaucher.
  const LANES = [{type:'mot', label:'Mots'}, {type:'procede', label:'Procédés'}, {type:'note', label:'Notes'}];
  const laneH = 108, subH = 32, subCount = 3;
  const positioned = [];
  LANES.forEach((lane, laneIdx)=>{
    const items = (g.Frise||[]).filter(f=>f.type===lane.type).sort((a,b)=>a.pos-b.pos);
    const lastPosBySub = [];
    items.forEach(f=>{
      let sub = 0;
      while(sub < subCount-1 && lastPosBySub[sub]!==undefined && Math.abs(f.pos-lastPosBySub[sub]) < 9) sub++;
      lastPosBySub[sub] = f.pos;
      positioned.push({...f, top: laneIdx*laneH + 30 + sub*subH});
    });
  });
  return `
  <p class="muted">Glissez vos mots et procédés sur la frise pour construire le déroulé temporel de votre chorégraphie. Double-cliquez sur la ligne « Notes » pour ajouter une note libre.</p>
  <h4 style="margin-bottom:8px;">À placer</h4>
  <div class="palette">
    ${tokens.map(t=>`<div class="chip type-${t.type}" draggable="true" data-type="${t.type}" data-texte="${escapeHtml(t.texte)}">${escapeHtml(t.texte)}</div>`).join('') || '<span class="muted">Ajoutez des mots et des procédés dans les onglets précédents.</span>'}
  </div>
  <div class="timeline" id="timeline">
    ${LANES.map((lane,i)=>`<div class="timeline-lane-label" style="top:${i*laneH}px;">${lane.label}</div>${i>0?`<div class="timeline-lane-sep" style="top:${i*laneH}px;"></div>`:''}`).join('')}
    ${positioned.map(f=>{
      if(f.type==='note'){
        return `<div class="timeline-chip type-note" draggable="true" data-id="${f.id}" data-type="note" data-texte=""
          style="left:${chipLeft(f.pos)}; top:${f.top}px;">
          <span class="note-icon">${f.texte?'📝':'+'}</span>
          <span class="rm" onclick="event.stopPropagation();removeFriseItem('${f.id}')">✕</span>
          <textarea placeholder="Note pour cet instant de la chorégraphie…" oninput="updateNoteText('${f.id}', this.value)">${escapeHtml(f.texte)}</textarea>
        </div>`;
      }
      return `<div class="timeline-chip type-${f.type}" draggable="true" data-id="${f.id}" data-type="${f.type}" data-texte="${escapeHtml(f.texte)}"
        style="left:${chipLeft(f.pos)}; top:${f.top}px;">
        ${escapeHtml(f.texte)} <span class="rm" onclick="removeFriseItem('${f.id}')">✕</span>
      </div>`;
    }).join('')}
  </div>
  <p class="timeline-add-hint">💡 Chaque type d'élément a sa propre ligne (Mots / Procédés / Notes). Double-cliquez sur la ligne « Notes » pour ajouter une note libre à un endroit précis.</p>`;
}
async function updateNoteText(id, val){
  const g = state.group;
  const item = (g.Frise||[]).find(x=>x.id===id);
  if(item){ item.texte = val; debounceSaveFrise(); }
}
const debounceSaveFrise = debounce(()=>{ saveGroupe({Frise: state.group.Frise}); }, 500);
async function removeFriseItem(id){
  const g = state.group;
  g.Frise = (g.Frise||[]).filter(x=>x.id!==id);
  await saveGroupe({Frise:g.Frise}); render();
}

async function saveGroupe(patch){
  const g = state.group;
  Object.assign(g, patch);
  localStorage.setItem('danse_group', JSON.stringify(g));
  try{
    await db.collection('groupes').doc(g.id).set({...patch, DateMaj:new Date().toISOString()},{merge:true});
  }catch(e){ /* hors-ligne : sera synchronisé automatiquement par la persistence Firestore */ }
}

/* ---------------- utilitaires ---------------- */
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a),ms); }; }

/* ---------------- rendu principal ---------------- */
function render(){
  const main = document.getElementById('main');
  let html = '';
  switch(state.view){
    case 'home': html = viewHome(); break;
    case 'admin-login': html = viewAdminLogin(); break;
    case 'admin-panel': html = viewAdminPanel(); break;
    case 'lesson-editor': html = viewLessonEditor(); break;
    case 'eleve-login': html = viewEleveLogin(); break;
    case 'eleve-identify': html = viewEleveIdentify(); break;
    case 'eleve-space': html = viewEleveSpace(); break;
    default: html = viewHome();
  }
  main.innerHTML = html;
  refreshHeader();
}

/* ---------------- démarrage ---------------- */
if(firebaseReady && auth){
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      state.adminUser = user.email;
      await loadLecons(); await loadProcedes(); await loadComposantes(); await loadGroupes(); state.allFiches = await loadAllFichesSpectateur(); state.allNotes = await loadAllNotesCoach(); state.allAnalyses = await loadAllAnalysesVideo();
      if(state.view==='home' || state.view==='admin-login') go('admin-panel');
    } else if(state.group){
      await loadLecons(); await loadProcedes(); await loadComposantes();
      await loadFichesSpectateur(state.group.id); await loadNotesCoach(state.group.id); await loadAnalysesVideo(state.group.id);
      if(state.view==='home'){ state.moi ? go('eleve-space') : go('eleve-identify'); }
      else render();
    } else {
      render();
    }
  });
} else {
  render();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
